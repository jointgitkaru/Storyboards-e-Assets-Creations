<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard Animation Engine · Studio</title>
<style>
  :root{
    --jet:#131417; --stone:#1c1e23; --stone2:#232630; --line:#2e323c;
    --paper:#e9e7e1; --dim:#9a9da6; --faint:#6b6f78;
    --amber:#d9b36a; --green:#7fc98f; --red:#e07a75; --yellow:#e3c47a;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--jet);color:var(--paper);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  a{color:var(--amber);text-decoration:none}

  .topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#17181d,#131417);position:sticky;top:0;z-index:20}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--paper)}
  .brand b{color:var(--amber);font-weight:600}
  .brand .sep{color:var(--faint);margin:0 8px}
  .pill{font-family:var(--mono);font-size:11px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;
    cursor:pointer;color:var(--dim);background:transparent}
  .pill.ok{color:var(--green);border-color:#2c4a35}
  .pill.bad{color:var(--red);border-color:#4a2c2c}
  .topbar .spacer{flex:1}
  .btn{font:600 12px/1 inherit;letter-spacing:.04em;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--stone2);color:var(--paper);cursor:pointer}
  .btn:hover{border-color:var(--amber);color:var(--amber)}
  .btn.primary{background:var(--amber);color:#171410;border-color:var(--amber)}
  .btn.primary:hover{filter:brightness(1.08);color:#171410}
  .btn.mini{padding:4px 9px;font-size:11px;border-radius:6px}
  .btn.ghost{background:transparent;color:var(--dim)}

  .layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 53px)}
  aside{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px}
  aside h2{font-family:var(--mono);font-size:10px;letter-spacing:.25em;color:var(--faint);margin:4px 2px 2px}
  .prod-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--stone)}
  .prod-card:hover{border-color:#3a3f4b}
  .prod-card.sel{border-color:var(--amber)}
  .prod-card .t{font-weight:600;font-size:13px}
  .prod-card .s{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px}
  .prod-card .meta{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
  .tag.reg{color:var(--amber);border-color:#4a3f27}
  .tag.warn{color:var(--yellow);border-color:#4a432e}
  .tag.bad{color:var(--red);border-color:#4a2c2c}

  main{padding:22px 26px;max-width:1120px;overflow:auto}
  .empty{margin-top:8vh;text-align:center;color:var(--dim)}
  .empty h1{font-size:20px;color:var(--paper);margin-bottom:10px}
  .empty code{font-family:var(--mono);font-size:12px;background:var(--stone);padding:2px 7px;border-radius:6px}
  .steps{margin:26px auto 0;max-width:520px;text-align:left;display:grid;gap:10px}
  .step{display:flex;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--stone)}
  .step b{font-family:var(--mono);color:var(--amber)}

  .prod-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .prod-head h1{font-size:22px;font-weight:700}
  .prod-head .slug{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--dim);padding:6px 12px;font:600 12px inherit;cursor:pointer}
  .seg button.on{background:var(--amber);color:#171410}
  .prod-actions{margin-left:auto;display:flex;gap:8px}

  .trail{margin:20px 0 8px;display:grid;gap:10px}
  .stage{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;background:var(--stone);padding:12px 14px}
  .stage.done{border-left-color:var(--green)}
  .stage.waiting{border-left-color:var(--yellow)}
  .stage .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .stage .dot{font-size:13px}
  .stage .ord{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .stage .nm{font-weight:600}
  .stage .tool{font-size:11.5px;color:var(--faint);margin-top:3px}
  .stage .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .qc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
  .chip.pass{color:var(--green);border-color:#2c4a35}
  .chip.fail{color:var(--red);border-color:#4a2c2c}

  .cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:22px}
  @media (max-width:980px){.cols{grid-template-columns:1fr}.layout{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);border-radius:12px;background:var(--stone);padding:14px}
  .panel h3{font-family:var(--mono);font-size:10px;letter-spacing:.25em;color:var(--faint);margin-bottom:10px}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .gal .item{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--stone2)}
  .gal .item img,.gal .item video{width:100%;height:104px;object-fit:cover;display:block;background:#0d0e10}
  .gal .cap{font-family:var(--mono);font-size:10px;color:var(--dim);padding:5px 7px;display:block;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  table.slots{width:100%;border-collapse:collapse;font-size:12px}
  table.slots td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
  table.slots td.k{font-family:var(--mono);color:var(--amber);white-space:nowrap;padding-right:10px}
  table.slots td.v{color:var(--paper);word-break:break-word}
  .slotform{display:flex;gap:6px;margin-top:10px}
  .slotform input{flex:1;min-width:0;background:var(--stone2);border:1px solid var(--line);border-radius:7px;
    color:var(--paper);padding:7px 9px;font:12px var(--mono)}
  .slotform input::placeholder{color:var(--faint)}

  .modal-bg{position:fixed;inset:0;background:rgba(10,11,13,.72);display:none;align-items:flex-start;
    justify-content:center;padding:5vh 16px;z-index:50}
  .modal-bg.open{display:flex}
  .modal{background:var(--stone);border:1px solid var(--line);border-radius:14px;max-width:860px;width:100%;
    max-height:86vh;display:flex;flex-direction:column}
  .modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .modal header h3{font-size:15px}
  .modal .body{padding:16px 18px;overflow:auto}
  .modal .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  pre.prompt{font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;background:#101114;
    border:1px solid var(--line);border-radius:10px;padding:14px;max-height:44vh;overflow:auto}
  .metachips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .diff{font:12px/1.5 var(--mono);white-space:pre;background:#101114;border:1px solid var(--line);
    border-radius:10px;padding:12px;max-height:44vh;overflow:auto}
  .diff .add{color:var(--green)} .diff .del{color:var(--red)} .diff .hud{color:var(--faint)}
  select{background:var(--stone2);color:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:12px var(--mono)}
  .idea-row{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 2px}
  .idea-row:first-child{border-top:0}
  .idea-row .n{font-family:var(--mono);color:var(--faint);width:24px;text-align:right}
  .idea-row .txt{flex:1}
  .ideas-tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .vt{width:100%;border-collapse:collapse;font:11.5px var(--mono)}
  .vt td{border-top:1px solid var(--line);padding:5px 6px}
  .vt .ok{color:var(--green)} .vt .bad{color:var(--red)} .vt .dim{color:var(--faint)}

  #toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:420px}
  .toast{border:1px solid var(--line);border-left:3px solid var(--green);background:var(--stone);border-radius:10px;
    padding:10px 12px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .toast.err{border-left-color:var(--red)}
  .toast details{margin-top:4px}
  .toast pre{font:10.5px/1.45 var(--mono);color:var(--dim);white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:4px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">STORYBOARD <b>ANIMATION</b> ENGINE<span class="sep">·</span>STUDIO</div>
  <button class="pill" id="verifyPill" onclick="openVerify()">verify: —</button>
  <div class="spacer"></div>
  <button class="btn" onclick="openEngine()">ENGINE · SESSION</button>
  <button class="btn" onclick="openIdeas()">IDEIAS · STATE 2</button>
  <button class="btn primary" onclick="openNewProd()">+ Nova produção</button>
</header>

<div class="layout">
  <aside id="sidebar"><h2>PRODUÇÕES</h2></aside>
  <main id="main"></main>
</div>

<div class="modal-bg" id="mbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="mbox"></div></div>
<input type="file" id="fileInput" style="display:none">
<div id="toasts"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let OV=null, SLUG=null, D=null;

async function api(path, opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  return r.json().catch(()=>({ok:false,error:'resposta inválida'}));
}
function toast(ok,msg,log){
  const t=document.createElement('div');t.className='toast'+(ok?'':' err');
  t.innerHTML=`<b>${ok?'✓':'✗'}</b> ${esc(msg)}`+(log?`<details><summary style="cursor:pointer;color:var(--faint)">log</summary><pre>${esc(log)}</pre></details>`:'');
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),9000);
}

/* ---------- boot & render ---------- */
async function boot(){OV=await api('/api/overview');renderVerify();renderSide();
  const first=OV.productions[0];if(first)select(first.slug);else renderEmpty();}
function renderVerify(){
  const p=OV.verify.problems,e=OV.verify.entries,el=$('#verifyPill');
  el.className='pill '+(p?'bad':'ok');
  el.textContent='verify: '+(p?p+' drift':e+' OK');
}
function renderSide(){
  $('#sidebar').innerHTML='<h2>PRODUÇÕES</h2>'+OV.productions.map(p=>`
    <div class="prod-card ${p.slug===SLUG?'sel':''}" onclick="select('${p.slug}')">
      <div class="t">${esc(p.title||p.slug)}</div>
      <div class="s">${esc(p.slug)} · ${p.done}/${p.total} etapas</div>
      <div class="meta">
        ${p.register?`<span class="tag reg">REG ${p.register}</span>`:'<span class="tag">sem registro</span>'}
        ${p.waiting?`<span class="tag warn">◐ ${p.waiting} aguardando</span>`:''}
        ${p.qc_fail?`<span class="tag bad">QC ✗</span>`:(p.qc_n?`<span class="tag" style="color:var(--green)">QC ✓</span>`:'')}
      </div>
    </div>`).join('');
}
function renderEmpty(){
  $('#main').innerHTML=`<div class="empty">
    <h1>Nenhuma produção aberta</h1>
    <p>Uma produção trava IDENTIDADE → DIMENSÃO → LOOK → CÂMERA → CLIP,<br>com gates, provenance e QC em cada etapa.</p>
    <div class="steps">
      <div class="step"><b>01</b><div>Gere 10 ideias no <a href="#" onclick="openIdeas();return false">STATE 2</a> (seed reproduzível) ou descreva a sua.</div></div>
      <div class="step"><b>02</b><div>Crie a produção, escolha o registro de estilo (A · B · C) e preencha os slots.</div></div>
      <div class="step"><b>03</b><div>Compile cada etapa, renderize (API → mock → manual) e valide com o QC automático.</div></div>
    </div></div>`;
}
async function select(slug){SLUG=slug;renderSide();
  D=await api(`/api/productions/${slug}`);if(D.error)return toast(false,D.error);
  renderMain();}

/* ---------- produção ---------- */
function renderMain(){
  const P=D.production;
  const regs=['A','B','C'].map(r=>`<button class="${P.register===r?'on':''}" onclick="setSlot(['register=${r}'])">${r}</button>`).join('');
  $('#main').innerHTML=`
    <div class="prod-head">
      <h1>${esc(P.title)}</h1><span class="slug">${esc(P.slug)} · ${P.created?.slice(0,10)}</span>
      <span class="seg" title="registro de estilo — um por produção">${regs}</span>
      <div class="prod-actions">
        <button class="btn mini" onclick="qc('register')">qc-register</button>
        <button class="btn mini primary" onclick="qc('all')">QC completo</button>
      </div>
    </div>
    <div class="trail">${D.stages.map(stageCard).join('')}</div>
    <div class="cols">
      <div class="panel"><h3>GALERIA · RENDERS & ASSETS</h3><div class="gal">${gallery()}</div></div>
      <div class="panel"><h3>SLOTS <span style="letter-spacing:0;color:var(--faint)">· production.json</span></h3>
        <table class="slots">${Object.entries(P.slots||{}).map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td class="v">${esc(v===true?'true':v===false?'false':v)}</td></tr>`).join('')||'<tr><td class="v" style="color:var(--faint)">nenhum slot definido</td></tr>'}</table>
        <div class="slotform">
          <input id="slotK" placeholder="chave (ex.: subject)">
          <input id="slotV" placeholder="valor (ex.: register=B, title=…)">
          <button class="btn mini" onclick="slotForm()">set</button>
        </div>
        <p style="margin-top:10px;color:var(--faint);font-size:11.5px">Chaves reservadas: <code>title</code> e <code>register</code>. Gates lembram o que falta em cada etapa.</p>
      </div>
    </div>`;
}
function stageCard(s){
  const dot=s.status==='rendered'?'<span style="color:var(--green)">●</span>':s.status==='awaiting_artifact'?'<span style="color:var(--yellow)">◐</span>':'<span style="color:var(--faint)">○</span>';
  const badges=[s.optional?'<span class="tag">opcional</span>':'',s.alt?'<span class="tag warn">alternativa</span>':'',
    s.adapter?`<span class="tag">via ${esc(s.adapter)}</span>`:'',
    s.status==='awaiting_artifact'?'<span class="tag warn">aguardando artefato</span>':''].join('');
  const qcChips=(s.qc||[]).map(q=>`<span class="chip ${q.pass?'pass':'fail'}">${esc(q.check)} ${esc(q.value)} ${q.pass?'✓':'✗'}</span>`).join('');
  const qcBtns={ 'storyboard-sheet':[["panels","painéis"]], 'depth-board':[["panels","painéis"]],
    'depth-map':[["grayscale","grayscale"]], 'clip':[["runtime","runtime"]], 'clip-5x3':[["runtime","runtime"]] }[s.id]||[];
  return `<div class="stage ${s.status==='rendered'?'done':s.status==='awaiting_artifact'?'waiting':''}">
    <div class="row1">
      ${dot}<span class="ord">${String(s.order).padStart(2,'0')}</span>
      <span class="nm">${esc(s.name)}</span>${badges}
      <div class="acts">
        ${s.prompt?`<button class="btn mini ghost" onclick="openPrompt('${s.id}')">prompt${''}</button>`:''}
        <button class="btn mini" onclick="act('render','${s.id}')">compilar</button>
        <button class="btn mini" onclick="act('run','${s.id}','mock')" title="stub sintético — testa a cadeia sem gastar API">run·mock</button>
        <button class="btn mini" onclick="act('run','${s.id}','manual')" title="grava .pending.md com instruções">run·manual</button>
        <button class="btn mini" onclick="act('run','${s.id}','auto')" title="API (se configurada) → mock → manual">run·auto</button>
        ${qcBtns.map(([c,l])=>`<button class="btn mini" onclick="qc('${c}','${s.id}')">qc·${l}</button>`).join('')}
        <button class="btn mini ghost" onclick="attach('${s.id}')" title="registrar arquivo gerado manualmente">attach</button>
      </div>
    </div>
    <div class="tool">↳ ${esc(s.tool)}${s.rendered_at?` · compilado ${esc(s.rendered_at.slice(0,16).replace('T',' '))}`:''}</div>
    ${qcChips?`<div class="qc-chips">${qcChips}</div>`:''}
  </div>`;
}
function gallery(){
  const items=[...D.renders.map(r=>({...r,dir:'renders'})),...D.assets.map(a=>({...a,dir:'assets'}))];
  if(!items.length)return '<p style="color:var(--faint)">sem artefatos ainda — compile e rode uma etapa</p>';
  return items.map(f=>{
    const url=`/${f.dir}/${SLUG}/${encodeURIComponent(f.name)}`;
    const media=f.name.endsWith('.mp4')||f.name.endsWith('.mov')
      ?`<video src="${url}" controls preload="metadata"></video>`
      :(f.name.match(/\.(png|jpe?g|webp|gif)$/)?`<img src="${url}" loading="lazy">`
      :`<div style="height:104px;display:flex;align-items:center;justify-content:center;color:var(--faint);font:11px var(--mono)">arquivo</div>`);
    return `<div class="item">${media}<a class="cap" href="${url}" target="_blank" title="${esc(f.name)}">${esc(f.dir+'/'+f.name)}</a></div>`;
  }).join('');
}

/* ---------- ações ---------- */
async function act(action,stage,mode){
  const body=mode?{stage,mode}:{stage};
  const r=await api(`/api/productions/${SLUG}/${action}`,{method:'POST',body:JSON.stringify(body)});
  toast(r.ok,`${action} ${stage}${mode?' · '+mode:''}${r.changed?' · prompt mudou (versão arquivada)':''}`,r.log||r.error);
  await refresh();
}
async function qc(check,stage){
  const r=await api(`/api/productions/${SLUG}/qc`,{method:'POST',body:JSON.stringify({check,stage:stage||''})});
  toast(r.ok,`QC ${check}${stage?' · '+stage:''}`,r.log||r.error);
  await refresh();
}
async function setSlot(pairs){
  const r=await api(`/api/productions/${SLUG}/set`,{method:'POST',body:JSON.stringify({pairs})});
  toast(r.ok,`set ${pairs.join(' ')}`,r.log||r.error);await refresh();
}
function slotForm(){const k=$('#slotK').value.trim(),v=$('#slotV').value.trim();
  if(k&&v!=='')setSlot([`${k}=${v}`]);}
async function refresh(){OV=await api('/api/overview');renderVerify();renderSide();
  if(SLUG){D=await api(`/api/productions/${SLUG}`);renderMain();}}
function attach(stage){
  const inp=$('#fileInput');inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    const r=await fetch(`/api/productions/${SLUG}/attach?stage=${stage}&name=${encodeURIComponent(f.name)}`,
      {method:'POST',body:await f.arrayBuffer()}).then(x=>x.json());
    toast(r.ok,`attach ${stage} ← ${f.name}`,r.log||r.error);inp.value='';await refresh();
  };inp.click();
}

/* ---------- modais ---------- */
function closeModal(){$('#mbg').classList.remove('open')}
function modal(html){$('#mbox').innerHTML=html;$('#mbg').classList.add('open')}

/* ---------- engine session (fase 3 · STATE 0–4) ---------- */
function sessLine(l){
  const cls={err:'diff del',gate:'diff hud',sys:'diff hud',ask:'diff hud',artifact:'diff add',info:'diff hud',opt:'',prompt:''}[l.t]||'';
  if(l.t==='prompt')return `<details style="margin:6px 0"><summary style="cursor:pointer;color:var(--amber);font:11px var(--mono)">▸ prompt enviado (${l.text.length} chars · verbatim — QUALITY BAR)</summary><pre class="prompt">${esc(l.text)}</pre></details>`;
  if(l.t==='you')return `<div style="padding:4px 0;font:12px var(--mono);color:var(--amber)">${esc(l.text)}</div>`;
  if(l.t==='artifact'){const m=l.text.match(/→ (\S+)/);const p=m?m[1]:'';
    const href=p.startsWith('productions/')?'/'+p.replace(/^productions\/[^/]+\//,''):null;
    return `<div class="${cls}" style="padding:2px 0">${esc(l.text)}${href?` · <a href="${href}" target="_blank">abrir</a>`:''}</div>`}
  return `<div class="${cls}" style="padding:2px 0;${l.t==='opt'?'font:12px var(--mono);color:var(--dim)':''}">${esc(l.text)}</div>`;
}
function sessQuick(st){
  const q={1:[['1','ADS'],['2','NON-ADS']],2:[['MORE','MORE ↻']],
    3:[['regenerate','regenerate'],['next','next → animar']],
    4:[['regenerate','regenerate'],['NEW','NEW → outro storyboard']]}[st]||[];
  return q.map(([v,l])=>`<button class="btn mini" onclick="sendSession('${v}')">${l}</button>`).join('');
}
async function openEngine(){
  modal(`<header><h3>ENGINE · SESSION — estados 0–4</h3>
    <span style="font:11px var(--mono);color:var(--faint)">um estado por vez · gates exatos do engine v3</span>
    <div style="flex:1"></div>
    <select id="sessMode" onchange="resetSession(this.value)">
      <option value="mock" ${window._sessMode!=='auto'?'selected':''}>modo mock (stubs)</option>
      <option value="auto" ${window._sessMode==='auto'?'selected':''}>modo auto (API→mock→manual)</option>
    </select>
    <button class="btn mini ghost" onclick="resetSession(window._sessMode||'mock')">reset</button>
    <button class="btn mini ghost" onclick="closeModal()">✕</button></header>
  <div class="body">
    <div id="sessLog" class="diff" style="max-height:52vh;min-height:260px;white-space:normal"></div>
    <div class="slotform" style="margin-top:12px">
      <input id="sessIn" placeholder="responda o gate (1/2 · nº da ideia · MORE · regenerate · revise subject=… · next · NEW)" onkeydown="if(event.key==='Enter')sendSession()">
      <button class="btn mini primary" onclick="sendSession()">enviar</button>
    </div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap" id="sessQuick"></div>
  </div>`);
  if(!window._sess){await resetSession(window._sessMode||'mock',true)}
  else sessDraw(window._sess);
  const inp=$('#sessIn');if(inp)inp.focus();
}
function sessDraw(s){
  const log=$('#sessLog');if(!log)return;
  log.innerHTML=(window._sessLines||[]).map(sessLine).join('');
  log.scrollTop=log.scrollHeight;
  const q=$('#sessQuick');if(q)q.innerHTML=sessQuick(s.state);
}
async function resetSession(mode,keep){
  window._sessMode=mode;
  const s=await api('/api/session/reset',{method:'POST',body:JSON.stringify({mode})});
  window._sess=s;window._sessLines=s.lines||[];
  if(!keep)toast(true,'sessão reiniciada (STATE 0 → '+s.state+')');
  sessDraw(s);
}
async function sendSession(v){
  const inp=$('#sessIn');const val=v||(inp?inp.value.trim():'');if(!val)return;
  if(inp)inp.value='';
  (window._sessLines=window._sessLines||[]).push({t:'you',text:'› '+val});
  const s=await api('/api/session',{method:'POST',body:JSON.stringify({input:val})});
  window._sess=s;(window._sessLines).push(...(s.lines||[]));
  sessDraw(s);
  OV=await api('/api/overview');renderVerify();renderSide();
  if(s.slug)select(s.slug);
}

async function openPrompt(stage){
  const d=await api(`/api/productions/${SLUG}/prompt/${stage}`);
  if(d.error)return toast(false,d.error);
  const m=d.meta||{};
  modal(`<header><h3>prompt · ${esc(stage)}</h3>
      <select id="histSel" onchange="openPrompt('${stage}',this.value)">
        <option value="">atual</option>
        ${d.history.map(h=>`<option value="${esc(h)}" ${window._h===h?'selected':''}>${esc(h)}</option>`).join('')}
      </select>
      ${d.history.length?`<button class="btn mini" onclick="window._h=document.getElementById('histSel').value||'${esc(d.history[0])}';openPrompt('${stage}',window._h)">ver diff</button>`:''}
      <div style="flex:1"></div>
      <button class="btn mini" onclick="navigator.clipboard.writeText(document.getElementById('ptext').innerText);toast(true,'copiado')">copiar</button>
      <button class="btn mini ghost" onclick="closeModal()">✕</button></header>
    <div class="body">
      <div class="metachips">
        <span class="tag">${esc(m.source||'')}</span>
        <span class="tag reg">${m.style_register?'REG '+m.style_register:'sem registro'}</span>
        <span class="tag">sha ${esc((m.template_sha256||'').slice(0,10))}</span>
        <span class="tag">${esc((m.slots_used||[]).join(', ')||'100% travado')}</span>
        ${m.rendered_at?`<span class="tag">${esc(m.rendered_at.slice(0,16).replace('T',' '))}</span>`:''}
      </div>
      ${d.diff!=null?`<div class="diff">${d.diff.map(l=>l.startsWith('+')?'<span class="add">'+esc(l)+'</span>':l.startsWith('-')?'<span class="del">'+esc(l)+'</span>':'<span class="hud">'+esc(l)+'</span>').join('\n')}</div>`
      :`<pre class="prompt" id="ptext">${esc(d.text)}</pre>`}
    </div>`);
}
function openNewProd(){
  modal(`<header><h3>nova produção</h3><div style="flex:1"></div><button class="btn mini ghost" onclick="closeModal()">✕</button></header>
  <div class="body">
    <div class="slotform"><input id="npSlug" placeholder="slug (a-z, hífen) ex.: forged-gold"><input id="npTitle" placeholder="título"></div>
    <div style="margin:12px 0;display:flex;gap:10px;align-items:center">
      registro de estilo:
      <span class="seg" id="npReg"><button class="on">A</button><button>B</button><button>C</button></span>
      <span style="color:var(--faint);font-size:11.5px">A feature · B commercial · C documentary — um por produção</span>
    </div>
  </div>
  <div class="foot"><button class="btn" onclick="closeModal()">cancelar</button>
    <button class="btn primary" onclick="createProd()">criar</button></div>`);
  $('#npReg').onclick=e=>{if(e.target.tagName==='BUTTON'){[...$('#npReg').children].forEach(b=>b.classList.remove('on'));e.target.classList.add('on')}};
}
async function createProd(){
  const slug=$('#npSlug').value.trim(),title=$('#npTitle').value.trim(),
    reg=$('#npReg .on')?.textContent;
  if(!slug)return toast(false,'slug obrigatório');
  const r=await api('/api/productions',{method:'POST',body:JSON.stringify({slug,title,register:reg})});
  toast(r.ok,`produção criada: ${slug}`,r.log||r.error);
  if(r.ok){closeModal();await refresh();select(slug)}
}
async function openVerify(){
  const v=await api('/api/verify');
  const rows=v.entries.map(e=>`<tr><td class="${e.drift?'bad':'ok'}">${e.drift?'DRIFT':'OK'}</td>
    <td>${esc(e.kind)}</td><td>${esc(e.id)}</td><td class="dim">${esc(e.sha)}${e.note?' · '+esc(e.note):''}</td></tr>`).join('');
  modal(`<header><h3>verify · fidelidade da biblioteca (M0)</h3><div style="flex:1"></div>
    <button class="btn mini ghost" onclick="closeModal()">✕</button></header>
  <div class="body"><p style="color:var(--dim);margin-bottom:10px">${v.problems?'✗ '+v.problems+' problema(s) — lock block alterado?':'✓ lock blocks batem com as fontes (sha256)'}</p>
  <table class="vt"><tr><td></td><td></td><td></td><td></td></tr>${rows}</table></div>`);
}
async function openIdeas(){
  window._seed=Math.floor(Math.random()*999999);window._cat='ads';
  modal(`<header><h3>STATE 2 · 10 ideias</h3><div style="flex:1"></div><button class="btn mini ghost" onclick="closeModal()">✕</button></header>
  <div class="body"><div class="ideas-tools">
      <span class="seg" id="ideaCat"><button data-c="ads" class="on" onclick="setCat('ads')">ADS</button><button data-c="non-ads" onclick="setCat('non-ads')">NON-ADS</button></span>
      <input id="ideaSeed" style="background:var(--stone2);border:1px solid var(--line);border-radius:7px;color:var(--paper);padding:6px 8px;font:12px var(--mono);width:110px" value="${window._seed}">
      <button class="btn mini" onclick="loadIdeas()">↻ mais 10</button>
      <span style="color:var(--faint);font-size:11.5px">seed reproduzível · colourway exato por ideia</span>
    </div><div id="ideaList" style="min-height:200px"></div></div>`);
  loadIdeas();
}
function setCat(c){window._cat=c;[...$('#ideaCat').children].forEach(b=>b.classList.toggle('on',b.dataset.c===c));loadIdeas()}
async function loadIdeas(){
  const seed=parseInt($('#ideaSeed').value)||window._seed;window._seed=seed;
  const d=await api(`/api/ideas?category=${window._cat}&seed=${seed}`);
  $('#ideaList').innerHTML=d.ideas.map((idea,i)=>`
    <div class="idea-row"><span class="n">${i+1}</span><span class="txt">${esc(idea)}</span>
      <button class="btn mini" onclick="ideaToProd(${i})">virar produção →</button></div>`).join('');
  window._ideas=d.ideas;
}
async function ideaToProd(i){
  const idea=window._ideas[i];
  const slug='prod-'+window._seed+'-'+(i+1);
  const reg=window._cat==='ads'?'B':'A';
  const r=await api('/api/productions',{method:'POST',body:JSON.stringify({slug,title:idea.split(' — ')[0].slice(0,40),register:reg})});
  if(!r.ok)return toast(false,r.error||'falha no init',r.log);
  await api(`/api/productions/${slug}/set`,{method:'POST',body:JSON.stringify({pairs:[`subject=${idea.split(' — ')[0]}`]})});
  toast(true,`produção '${slug}' criada a partir da ideia ${i+1} (REG ${reg}) — preencha os beats e compile`);
  closeModal();await refresh();select(slug);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
boot();
</script>
</body>
</html>
